<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>EZP — Floor</title>
<link rel="stylesheet" href="commoncss-2ndphase.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{
    margin:0;
    font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial;
    background:var(--bg);
    color:var(--text);
    
  }
  .wrap{max-width:1100px;margin:18px auto;padding:18px}

  /* header */
  .header{
    display:flex;
    align-items:flex-start;
    gap:12px;
    margin-bottom:10px;
  }
  .back-btn{
    border:0;
    background:transparent;
    color:var(--muted);
    font-size:20px;
    cursor:pointer;
    padding:6px 10px;
    border-radius:999px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .15s,color .15s;
  }
  .back-btn:hover{
    background:rgba(255,255,255,0.06);
    color:var(--accent);
  }
  .header-main{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .title{font-weight:800;font-size:18px}
  .subtitle{font-size:13px;color:var(--muted)}
  .meta{margin-left:auto;color:var(--muted);font-size:13px}

  /* tabs */
  .tabs{
    margin-top:6px;
    display:inline-flex;
    padding:3px;
    border-radius:999px;
    background:rgba(255,255,255,0.04);
  }
  .floor-tab{
    border:0;
    background:transparent;
    color:var(--muted);
    padding:5px 14px;
    border-radius:999px;
    font-size:13px;
    cursor:pointer;
    transition:background .15s,color .15s;
    white-space:nowrap;
  }
  .floor-tab.active{
    background:var(--panel);
    color:var(--accent);
    box-shadow:0 6px 18px rgba(0,0,0,0.45);
  }

  /* main panel */
  .panel{
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.03));
    border-radius:14px;
    padding:18px;
    border:1px solid var(--panel-border);
    box-shadow:0 10px 26px rgba(2,6,12,0.55);
  }
  .legend-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
    font-size:13px;
    color:var(--muted);
  }
  .legend-group{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .legend-dot{
    width:10px;height:10px;border-radius:50%;display:inline-block;
  }
  .legend-dot.free{background:var(--accent);}
  .legend-dot.occ{background:var(--danger);}
  .legend-dot.acc{background:#86c5ff;}

  .sealed-tag{
    background:rgba(230,100,100,0.08);
    color:var(--danger);
    padding:6px 10px;
    border-radius:10px;
    font-size:12px;
  }

  /* parking layout */
  .parking-layout{
    padding:14px;
    border-radius:12px;
    background:rgba(3,10,20,0.9);
    border:1px solid rgba(255,255,255,0.03);
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  /* row of slots */
  .slot-row{
    display:grid;
    grid-template-columns: repeat(3, minmax(60px,1fr));
    gap:8px;
  }
  .slot-cell{
    min-height:40px;
  }

  .slot-tile{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    border-radius:9px;
    padding:6px 4px;
    border:2px solid var(--panel-border);
    background:linear-gradient(180deg,rgba(0,0,0,0.35),rgba(0,0,0,0.16));
    font-size:11px;
    font-weight:800;
    cursor:pointer;
    min-height:46px;
    position:relative;
    transition:transform .12s, box-shadow .12s, border-color .12s, background .12s;
  }
  .slot-tile.free{
    border-color:rgba(25,178,139,0.4);
    color:var(--accent);
  }
  .slot-tile.occupied{
    border-color:rgba(255,80,80,0.45);
    color:var(--danger);
    background:rgba(255,80,80,0.07);
  }
  .slot-tile:hover{
    transform:translateY(-1px);
    box-shadow:0 4px 18px rgba(0,0,0,0.5);
  }
  .slot-code{margin-bottom:2px;}
  .slot-car{
    font-size:14px;
    opacity:.85;
  }
  .slot-acc{
    position:absolute;
    right:4px;
    bottom:2px;
    font-size:11px;
    opacity:.8;
  }

  /* lanes / concrete medians (style C) */
  .lane{
    border-radius:8px;
    position:relative;
    overflow:hidden;
  }
  .lane-small{
    height:26px;
    background:linear-gradient(180deg,rgba(60,60,60,0.4),rgba(30,30,30,0.6));
    border-top:1px solid rgba(255,255,255,0.12);
    border-bottom:1px solid rgba(255,255,255,0.15);
  }
  .lane-small::before{
    content:'';
    position:absolute;
    left:8%;
    right:8%;
    top:50%;
    height:2px;
    border-top:2px dashed rgba(255,255,255,0.3);
    transform:translateY(-50%);
  }

  .lane-main{
    height:38px;
    background:linear-gradient(180deg,rgba(110,110,110,0.8),rgba(50,50,50,0.9));
    border:1px solid rgba(255,255,255,0.18);
  }
  .lane-main::before{
    content:'';
    position:absolute;
    left:50%;
    top:4px;
    bottom:4px;
    width:3px;
    border-left:2px dashed rgba(255,255,255,0.7);
    transform:translateX(-50%);
  }
  .lane-main span{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    font-size:11px;
    color:var(--muted);
  }

  .entry-exit{
    display:flex;
    justify-content:space-between;
    color:var(--muted);
    font-size:12px;
    margin-top:10px;
    padding:0 4px;
  }

  /* modal */
  #modal{
    display:none;
    position:fixed;
    inset:0;
    align-items:center;
    justify-content:center;
    background:rgba(2,3,6,0.6);
    backdrop-filter:blur(4px);
    z-index:50;
  }
  .modal-card{
    width:92%;
    max-width:420px;
    background:var(--panel);
    padding:14px;
    border-radius:12px;
    border:1px solid var(--panel-border);
  }
  .chip{
    padding:8px 12px;
    border-radius:8px;
    border:1px solid var(--panel-border);
    background:transparent;
    color:var(--text);
    cursor:pointer;
  }

  @media(max-width:900px){
    .slot-row{
      grid-template-columns: repeat(3, minmax(60px,1fr));
    }
  }
  @media(max-width:720px){
    .wrap{padding:12px}
    .slot-row{
      grid-template-columns: repeat(3, minmax(56px,1fr));
    }
    .slot-tile{font-size:10px;min-height:40px}
    .lane-main{height:32px}
    .lane-small{height:22px}
  }
  
  
</style>
</head>
<body>
  <!-- Bottom Navigation -->
<div class="bottom-nav">
  <button class="nav-btn" data-page="home" onclick="location='homehtml-2ndphase.html'">Home</button>
  <button class="nav-btn" data-page="alerts" onclick="location='alerthtml-2ndphase.html'">Alerts</button>
  <button class="nav-btn" data-page="insights" onclick="location='insighthtml-2ndphase.html'">Insights</button>
  <button class="nav-btn" data-page="settings" onclick="location='settinghtml-2ndphase.html'">Settings</button>
</div>

<div class="wrap">
<div class="header">
  <button class="back-btn" id="btnBack">←</button>

  <div class="header-main">
    <div class="title" id="pageTitle">Floor</div>
    <div class="subtitle" id="pageSub">—</div>
    <div class="tabs">
      <button class="floor-tab active" data-level="GND">Ground</button>
      <button class="floor-tab" data-level="UPP">Upper deck</button>
    </div>
  </div>

  <div class="meta" id="counts">Free 0 • Occ 0</div>
</div>

  <div class="panel">
    <div class="legend-row">
      <div class="legend-group">
        <span class="legend-dot free"></span><span>Free</span>
        <span class="legend-dot occ" style="margin-left:12px"></span><span>Occupied</span>
        <span class="legend-dot acc" style="margin-left:12px"></span><span>Accessible</span>
      </div>
      <div class="sealed-tag">Old bottom gate sealed</div>
    </div>

    <div class="parking-layout" id="parkingLayout">
      <!-- layout rows are inserted here by JS using HTML grids -->
    </div>

    <div class="entry-exit" id="entryExit">
      <div>← Entry</div>
      <div>Exit →</div>
    </div>
  </div>
</div>

<!-- modal -->
<div id="modal">
  <div class="modal-card">
    <div id="modalContent"></div>
    <div style="text-align:right;margin-top:12px">
      <button class="chip" id="closeModal">Close</button>
    </div>
  </div>
</div>

<script>
// TODO: replace these with your real Supabase project values
const SUPABASE_URL = "https://pyyuzvswiboxccylmmib.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5eXV6dnN3aWJveGNjeWxtbWliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk1Nzk2MTEsImV4cCI6MjA4NTE1NTYxMX0.EAOC6UrzfcE3pUe56uAOFsslYBKJG4UEdiGlv7vWDP0";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const FLOOR_POSITIONS = ["LEFT", "MIDDLE", "RIGHT"];

/* =========================
   HELPERS
========================= */
function formatSlotCode(floor, position) {
  return `${floor}-${position}`;
}

function statusClass(status) {
  if (status === "occupied") return "occupied";
  return "free";
}

/* =========================
   LOAD FLOOR STATE
   - GND: real-time occupancy from slot_status
   - UPP: reservation-only; show current user's reservations
========================= */
async function loadFloorState(level) {
  const { data: slots, error: slotsError } = await supabase
    .from("slots")
    .select("id, floor, position, is_reservable")
    .eq("floor", level);

  if (slotsError || !slots) {
    console.error("Slots error", slotsError);
    return [];
  }

  const slotIds = slots.map((s) => s.id);

  // Slot occupancy from ESP32
  const { data: statuses } = await supabase
    .from("slot_status")
    .select("slot_id, occupied")
    .in("slot_id", slotIds);

  const statusMap = {};
  (statuses || []).forEach((s) => {
    statusMap[s.slot_id] = s.occupied;
  });

  let myReservationsMap = {};
  let session = null;

  if (level === "UPP") {
    const { data: sessionData } = await supabase.auth.getSession();
    session = sessionData?.session || null;

    if (session) {
      const nowIso = new Date().toISOString();
      const { data: myRes, error: resError } = await supabase
        .from("reservations")
        .select("id, slot_id, status, plate_id, start_time, end_time")
        .in("slot_id", slotIds)
        .lte("start_time", nowIso)
        .gt("end_time", nowIso);

      if (resError) {
        console.error("Reservations error", resError);
      } else {
        (myRes || []).forEach((r) => {
          myReservationsMap[r.slot_id] = r;
        });
      }
    }
  }

  return slots.map((slot) => {
    const occupied = !!statusMap[slot.id];
    const myRes = myReservationsMap[slot.id];

    let logicalStatus = "free";

    if (level === "GND") {
      logicalStatus = occupied ? "occupied" : "free";
    } else {
      if (!slot.is_reservable) {
        logicalStatus = "free";
      } else if (myRes) {
        logicalStatus =
          myRes.status === "checked_in" ? "checked_in" : "reserved_by_me";
      } else {
        logicalStatus = "free";
      }
    }

    return {
      id: slot.id,
      floor: slot.floor,
      position: slot.position,
      code: formatSlotCode(slot.floor, slot.position),
      occupied,
      status: logicalStatus,
      reservation: myRes || null,
    };
  });
}

/* =========================
   RESERVATION & CHECK-IN (UPP)
========================= */
async function ensureLoggedIn() {
  const { data } = await supabase.auth.getSession();
  if (data?.session) return data.session;
  alert("Please login with Supabase Auth before reserving.");
  throw new Error("Not logged in");
}

async function pickPlate() {
  const { data: plates, error } = await supabase
    .from("plates")
    .select("id, plate_number");

  if (error) {
    console.error("Plate load error", error);
    alert("Failed to load plates");
    throw error;
  }

  if (!plates || !plates.length) {
    alert("No plates found. Please register a plate first.");
    throw new Error("No plates");
  }

  if (plates.length === 1) return plates[0];

  const menu = plates
    .map((p, idx) => `${idx + 1}. ${p.plate_number}`)
    .join("\n");
  const choice = prompt(`Select plate by number:\n${menu}`);
  const idx = Number(choice) - 1;
  const plate = plates[idx];

  if (!plate) {
    alert("Invalid plate selection");
    throw new Error("Bad plate selection");
  }

  return plate;
}

async function createReservationForSlot(slot) {
  const session = await ensureLoggedIn();
  const plate = await pickPlate();

  const startTime = new Date().toISOString();

  const { data, error } = await supabase.rpc("create_reservation", {
    p_user_id: session.user.id,
    p_plate_id: plate.id,
    p_slot_id: slot.id,
    p_start_time: startTime,
  });

  if (error) {
    console.error("Reservation error", error);
    if (error.message === "SLOT_ALREADY_BOOKED") {
      alert("This slot is already reserved in this time window.");
    } else if (error.message === "SLOT_NOT_RESERVABLE") {
      alert("This slot cannot be reserved.");
    } else {
      alert("Failed to create reservation.");
    }
    return null;
  }

  alert("Reservation created for 3 minutes (demo).");
  return data;
}

async function checkInForSlot(slot) {
  const session = await ensureLoggedIn();

  if (!slot.reservation) {
    alert("No active reservation found for this slot.");
    return;
  }

  const CHECK_IN_FUNCTION_URL =
    "https://YOUR-PROJECT-ID.functions.supabase.co/check-in";

  const response = await fetch(CHECK_IN_FUNCTION_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      Authorization: `Bearer ${session.access_token}`,
    },
    body: JSON.stringify({
      reservation_id: slot.reservation.id,
      plate_id: slot.reservation.plate_id,
    }),
  });

  const result = await response.json().catch(() => null);

  if (!response.ok || !result) {
    alert("Check-in failed.");
    return;
  }

  if (result.status === "ALLOW") {
    alert("Check-in allowed. You may park now.");
  } else {
    alert(`Check-in denied: ${result.reason}`);
  }
}

/* =========================
   CREATE SLOT TILE
========================= */
function createSlotEl(slot, level) {
  const el = document.createElement("div");

  el.className = "slot-tile " + statusClass(slot.status);

  let label = slot.code;
  if (level === "UPP") {
    if (slot.status === "reserved_by_me") {
      label += " (reserved)";
    } else if (slot.status === "checked_in") {
      label += " (checked-in)";
    }
  }

  el.innerHTML = `
    <div class="slot-code">${label}</div>
    <div class="slot-car">🚗</div>
  `;

  el.addEventListener("click", async () => {
    if (level === "GND") {
      alert("Ground floor uses real-time occupancy only (no reservations).");
      return;
    }

    try {
      if (!slot.reservation) {
        await createReservationForSlot(slot);
      } else {
        await checkInForSlot(slot);
      }
      renderLayout(level);
    } catch (e) {
      console.error(e);
    }
  });

  return el;
}

/* =========================
   RENDER FLOOR
========================= */
async function renderLayout(level) {
  const layout = document.getElementById("parkingLayout");
  layout.innerHTML = "";

  const slots = await loadFloorState(level);

  let free = 0;
  let occ = 0;

  slots.forEach((s) => {
    if (s.status === "occupied") occ++;
    else free++;
  });

  document.getElementById("counts").textContent = `Free ${free} • Occ ${occ}`;

  document.getElementById("pageTitle").textContent =
    level === "UPP" ? "Upper Deck" : "Ground Level";

  const row = document.createElement("div");
  row.className = "slot-row";

  FLOOR_POSITIONS.forEach((pos) => {
    const cell = document.createElement("div");
    cell.className = "slot-cell";

    const slot = slots.find((s) => s.position === pos);
    if (slot) {
      cell.appendChild(createSlotEl(slot, level));
    }

    row.appendChild(cell);
  });

  layout.appendChild(row);
}

/* =========================
   INIT
========================= */
document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll(".floor-tab").forEach((btn) => {
    btn.addEventListener("click", () => {
      document
        .querySelectorAll(".floor-tab")
        .forEach((b) => b.classList.remove("active"));

      btn.classList.add("active");
      renderLayout(btn.dataset.level);
    });
  });

  document.getElementById("btnBack")?.addEventListener("click", () => {
    window.location.href = "homehtml-2ndphase.html";
  });

  // Support deep-link from home: floorhtml-2ndphase.html#UPP
  const initialLevel =
    (window.location.hash === "#UPP" ? "UPP" : "GND");

  document
    .querySelectorAll(".floor-tab")
    .forEach((b) =>
      b.classList.toggle("active", b.dataset.level === initialLevel)
    );

  renderLayout(initialLevel);

  setInterval(() => {
    const active =
      document.querySelector(".floor-tab.active")?.dataset.level || "GND";

    renderLayout(active);
  }, 3000);
});
</script>
</body>
</html>
