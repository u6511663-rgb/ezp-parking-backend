<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>EZP — Floor</title>
<link rel="stylesheet" href="common.css">
<style>
  body{
    margin:0;
    font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial;
    background:var(--bg);
    color:var(--text);
    
  }
  .wrap{max-width:1100px;margin:18px auto;padding:18px}

  /* header */
  .header{
    display:flex;
    align-items:flex-start;
    gap:12px;
    margin-bottom:10px;
  }
  .back-btn{
    border:0;
    background:transparent;
    color:var(--muted);
    font-size:20px;
    cursor:pointer;
    padding:6px 10px;
    border-radius:999px;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:background .15s,color .15s;
  }
  .back-btn:hover{
    background:rgba(255,255,255,0.06);
    color:var(--accent);
  }
  .header-main{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .title{font-weight:800;font-size:18px}
  .subtitle{font-size:13px;color:var(--muted)}
  .meta{margin-left:auto;color:var(--muted);font-size:13px}

  /* tabs */
  .tabs{
    margin-top:6px;
    display:inline-flex;
    padding:3px;
    border-radius:999px;
    background:rgba(255,255,255,0.04);
  }
  .floor-tab{
    border:0;
    background:transparent;
    color:var(--muted);
    padding:5px 14px;
    border-radius:999px;
    font-size:13px;
    cursor:pointer;
    transition:background .15s,color .15s;
    white-space:nowrap;
  }
  .floor-tab.active{
    background:var(--panel);
    color:var(--accent);
    box-shadow:0 6px 18px rgba(0,0,0,0.45);
  }

  /* main panel */
  .panel{
    background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.03));
    border-radius:14px;
    padding:18px;
    border:1px solid var(--panel-border);
    box-shadow:0 10px 26px rgba(2,6,12,0.55);
  }
  .legend-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:12px;
    font-size:13px;
    color:var(--muted);
  }
  .legend-group{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .legend-dot{
    width:10px;height:10px;border-radius:50%;display:inline-block;
  }
  .legend-dot.free{background:var(--accent);}
  .legend-dot.occ{background:var(--danger);}
  .legend-dot.acc{background:#86c5ff;}

  .sealed-tag{
    background:rgba(230,100,100,0.08);
    color:var(--danger);
    padding:6px 10px;
    border-radius:10px;
    font-size:12px;
  }

  /* parking layout */
  .parking-layout{
    padding:14px;
    border-radius:12px;
    background:linear-gradient(180deg, rgba(7,15,28,0.98), rgba(5,11,22,0.98));
    border:1px solid rgba(86,122,168,0.14);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.03);
    display:flex;
    flex-direction:column;
    gap:18px;
  }

  /* row of slots */
  .slot-row{
    display:grid;
    grid-template-columns: repeat(3, minmax(150px,1fr));
    gap:14px;
    max-width:560px;
    margin:0 auto;
    width:100%;
  }
  .slot-cell{
    min-height:40px;
  }

  .slot-tile{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    border-radius:10px;
    padding:10px 8px;
    border:2px solid rgba(255,255,255,0.08);
    background:linear-gradient(180deg, rgba(12,18,30,0.96), rgba(7,12,22,0.96));
    font-size:12px;
    font-weight:800;
    cursor:pointer;
    min-height:72px;
    position:relative;
    transition:transform .12s, box-shadow .12s, border-color .12s, background .12s;
  }
  .slot-tile.free{
    border-color:rgba(18,211,144,0.75);
    color:#34f5ae;
    box-shadow:0 0 0 1px rgba(18,211,144,0.14), inset 0 0 18px rgba(18,211,144,0.06);
  }
  .slot-tile.occupied{
    border-color:rgba(255,91,91,0.8);
    color:#ff6b6b;
    background:linear-gradient(180deg, rgba(34,10,16,0.96), rgba(22,8,12,0.96));
    box-shadow:0 0 0 1px rgba(255,91,91,0.12), inset 0 0 18px rgba(255,91,91,0.08);
  }
  .slot-tile:hover{
    transform:translateY(-1px);
    box-shadow:0 4px 18px rgba(0,0,0,0.5);
  }
  .slot-code{
    margin-bottom:6px;
    font-size:12px;
    letter-spacing:.04em;
  }
  .slot-car{
    font-size:16px;
    opacity:.85;
  }
  .slot-acc{
    position:absolute;
    right:4px;
    bottom:2px;
    font-size:11px;
    opacity:.8;
  }

  .entry-exit{
    display:flex;
    justify-content:space-between;
    color:var(--muted);
    font-size:12px;
    margin-top:2px;
    padding:0 4px;
  }

  /* modal */
  #modal{
    display:none;
    position:fixed;
    inset:0;
    align-items:center;
    justify-content:center;
    background:rgba(2,3,6,0.6);
    backdrop-filter:blur(4px);
    z-index:50;
  }
  .modal-card{
    width:92%;
    max-width:420px;
    background:var(--panel);
    padding:14px;
    border-radius:12px;
    border:1px solid var(--panel-border);
  }
  .chip{
    padding:8px 12px;
    border-radius:8px;
    border:1px solid var(--panel-border);
    background:transparent;
    color:var(--text);
    cursor:pointer;
  }

  @media(max-width:900px){
    .slot-row{
      grid-template-columns: repeat(3, minmax(110px,1fr));
    }
  }
  @media(max-width:720px){
    .wrap{padding:12px}
    .slot-row{
      grid-template-columns: repeat(3, minmax(88px,1fr));
    }
    .slot-tile{font-size:10px;min-height:60px}
  }
  
  
</style>
</head>
<body>
  <!-- Bottom Navigation -->
<div class="bottom-nav">
  <button class="nav-btn" data-page="home" onclick="location='home.html'">Home</button>
  <button class="nav-btn" data-page="alerts" onclick="location='alerts.html'">Alerts</button>
  <button class="nav-btn" data-page="settings" onclick="location='settings.html'">Settings</button>
</div>

<div class="wrap">
<div class="header">
  <button class="back-btn" id="btnBack">←</button>

  <div class="header-main">
    <div class="title" id="pageTitle">Floor</div>
    <div class="subtitle" id="pageSub">—</div>
    <div class="tabs">
      <button class="floor-tab active" data-level="F1">1st Floor</button>
      <button class="floor-tab" data-level="F2">2nd Floor</button>
    </div>
  </div>

  <div class="meta" id="counts">Free 0 • Occ 0</div>
</div>

  <div class="panel">
    <div class="legend-row">
      <div class="legend-group">
        <span class="legend-dot free"></span><span>Free</span>
        <span class="legend-dot occ" style="margin-left:12px"></span><span>Occupied</span>
        <span class="legend-dot acc" style="margin-left:12px"></span><span>Accessible</span>
      </div>
      <div class="sealed-tag">Old bottom gate sealed</div>
    </div>

    <div class="parking-layout" id="parkingLayout">
      <!-- layout rows are inserted here by JS using HTML grids -->
    </div>

    <div class="entry-exit" id="entryExit">
      <div>← Entry</div>
      <div>Exit →</div>
    </div>
  </div>
</div>

<!-- modal -->
<div id="modal">
  <div class="modal-card">
    <div id="modalContent"></div>
    <div style="text-align:right;margin-top:12px">
      <button class="chip" id="closeModal">Close</button>
    </div>
  </div>
</div>

<script>
const API = "/api";

/* =========================
   FLOOR ID MAP (DB mapping)
========================= */
const FLOOR_ID_MAP = {
  F1: 1,
  F2: 2
};

/* =========================
   VISUAL LAYOUT DEFINITION
========================= */
const FLOOR_LAYOUT = {
  F1: {
    rows: [
      ['F1-S1','F1-S2','F1-S3']
    ]
  },
  F2: {
    rows: [
      ['F2-S1','F2-S2','F2-S3']
    ]
  }
};

/* =========================
   LOAD SLOTS
========================= */
async function loadSlots(floorId){
  const res = await fetch(`${API}/floors/${floorId}/slots`);
  if(!res.ok) return [];
  return await res.json();
}

/* =========================
   UPDATE SLOT STATUS
========================= */
async function updateSlot(slotId, newStatus){
  await fetch(`${API}/slots/${slotId}/status`,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ status:newStatus })
  });
}

/* =========================
   CREATE SLOT TILE
========================= */
function createSlotEl(slot){

  const el = document.createElement("div");

  el.className =
    "slot-tile " +
    (slot.status === "free" ? "free" : "occupied");

  el.innerHTML = `
    <div class="slot-code">${slot.displayCode || slot.code}</div>
    <div class="slot-car">🚗</div>
  `;

  /* ===== TOGGLE STATUS ===== */
  el.addEventListener("click", async ()=>{

    const newStatus =
      slot.status === "free"
      ? "occupied"
      : "free";

    // Optimistic UI
    el.classList.remove("free","occupied");
    el.classList.add(newStatus);

    slot.status = newStatus;

    await updateSlot(slot.id, newStatus);
  });

  return el;
}

function buildDefaultSlot(level, index, floorId) {
  return {
    id: `${floorId}-${index + 1}`,
    floor_id: floorId,
    slot: index + 1,
    code: `${level}-S${index + 1}`,
    displayCode: `${level}-0${index + 1}`,
    status: "free"
  };
}

/* =========================
   RENDER FLOOR
========================= */
async function renderLayout(level){

  const floorId = FLOOR_ID_MAP[level];
  if(!floorId) return;

  const slots = await loadSlots(floorId);

  const SLOT_MAP = {};
  let free = 0;
  const normalizedSlots = Array.from({ length: 3 }, (_, index) => {
    const source = Array.isArray(slots) ? slots[index] : null;
    if (!source) {
      return buildDefaultSlot(level, index, floorId);
    }

    const displayCode = level === "F2"
      ? `F2-0${index + 1}`
      : `F1-0${index + 1}`;
    const syntheticCode = level === "F2"
      ? `F2-S${index + 1}`
      : `F1-S${index + 1}`;

    return {
      ...source,
      code: syntheticCode,
      displayCode,
      status: source.status === "occupied" ? "occupied" : "free"
    };
  });

  normalizedSlots.forEach((slot) => {
    SLOT_MAP[slot.code] = slot;
    if(slot.status === "free") free++;
  });

  const total = normalizedSlots.length;
  const occ = total - free;

  document.getElementById("counts").textContent =
    `Free ${free} • Occ ${occ}`;

  document.getElementById("pageTitle").textContent =
    level === "F2" ? "2nd Floor" : "1st Floor";

  const layoutDef = FLOOR_LAYOUT[level];
  const layout = document.getElementById("parkingLayout");
  layout.innerHTML = "";
  document.getElementById("pageSub").textContent =
    level === "F2"
      ? "Barrier booking floor with 3 slots"
      : "General parking floor with 3 slots";

  layoutDef.rows.forEach(rowDef=>{
    const row = document.createElement("div");
    row.className = "slot-row";

    rowDef.forEach(code=>{
      const cell = document.createElement("div");
      cell.className = "slot-cell";

      if(code && SLOT_MAP[code]){
        cell.appendChild(createSlotEl(SLOT_MAP[code]));
      }

      row.appendChild(cell);
    });

    layout.appendChild(row);
  });
}

/* =========================
   INIT
========================= */
document.addEventListener("DOMContentLoaded", ()=>{

  // Tab switch
  document.querySelectorAll(".floor-tab")
    .forEach(btn=>{
      btn.addEventListener("click", ()=>{
        document.querySelectorAll(".floor-tab")
          .forEach(b=>b.classList.remove("active"));

        btn.classList.add("active");
        renderLayout(btn.dataset.level);
      });
    });

  // Back
  document.getElementById("btnBack")
    ?.addEventListener("click", ()=>{
      window.location.href = "/";
    });

  const hashLevel = (window.location.hash || "").replace("#", "").toUpperCase();
  const initialLevel = hashLevel === "F2" ? "F2" : "F1";

  document.querySelectorAll(".floor-tab")
    .forEach(btn=>{
      btn.classList.toggle("active", btn.dataset.level === initialLevel);
    });

  renderLayout(initialLevel);

  // Auto refresh
  setInterval(()=>{
    const active =
      document.querySelector(".floor-tab.active")
      ?.dataset.level || "F1";

    renderLayout(active);
  },3000);

});
</script>
</body>
</html>
