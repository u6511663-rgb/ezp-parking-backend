<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EZP - Alerts</title>

<link rel="stylesheet" href="common.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .container{max-width:1100px;margin:20px auto;padding:20px}
  .top-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:18px;
  }
  .app-title{font-size:26px;font-weight:800}
  .app-sub{color:var(--muted);margin-top:6px}
  .header-right{
    display:flex;
    flex-direction:column;
    gap:10px;
    align-items:flex-end;
  }
  .online-pill{
    padding:8px 14px;
    border-radius:20px;
    border:1px solid var(--panel-border);
    background:rgba(0,0,0,0.2);
    color:var(--accent);
    font-size:13px;
  }
  .account-link{
    border:1px solid var(--panel-border);
    background:transparent;
    color:var(--text);
    padding:8px 12px;
    border-radius:12px;
    cursor:pointer;
    font-size:13px;
    font-weight:800;
  }
  .alerts-list{
    display:grid;
    gap:12px;
    margin-top:18px;
  }
  .booking-card{
    border:1px solid var(--panel-border);
    border-radius:18px;
    background:rgba(255,255,255,0.02);
    padding:16px;
  }
  .booking-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    flex-wrap:wrap;
  }
  .booking-title{
    font-size:18px;
    font-weight:800;
  }
  .booking-badges{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .status-pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:6px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
    border:1px solid rgba(255,255,255,0.08);
  }
  .status-pill.upcoming{
    color:#ffd27a;
    background:rgba(255,210,122,0.12);
  }
  .status-pill.active{
    color:#68f2bb;
    background:rgba(104,242,187,0.12);
  }
  .status-pill.done{
    color:var(--muted);
    background:rgba(255,255,255,0.05);
  }
  .booking-grid{
    margin-top:14px;
    display:grid;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:12px;
  }
  .booking-meta{
    border-radius:14px;
    padding:12px;
    background:rgba(255,255,255,0.02);
  }
  .booking-meta .small{
    display:block;
    margin-bottom:4px;
  }
  .page-msg{
    margin-top:16px;
  }
  @media (max-width:720px){
    .top-header{
      flex-direction:column;
      gap:12px;
    }
    .header-right{
      align-items:flex-start;
    }
    .booking-grid{
      grid-template-columns:1fr;
    }
  }
</style>
</head>
<body>

<div class="container">
  <div class="top-header">
    <div>
      <div class="app-title">Alerts</div>
      <div class="app-sub">Your booking alerts and upcoming parking times</div>
    </div>
    <div class="header-right">
      <button class="account-link" type="button" onclick="location='./auth.html'">Account</button>
      <div class="online-pill">● Online • Booking sync ready</div>
    </div>
  </div>

  <div class="card" style="margin-top:18px">
    <div id="alertsSummary" class="small">Loading your bookings...</div>
    <div id="alertsMsg" class="small page-msg"></div>
    <div id="alertsContainer" class="alerts-list"></div>
  </div>
</div>

<div class="bottom-nav">
  <button class="nav-btn" data-page="home" onclick="location='./home.html'">Home</button>
  <button class="nav-btn active" data-page="alerts.html">Alerts</button>
  <button class="nav-btn" data-page="settings" onclick="location='./settings.html'">Settings</button>
</div>

<script>
let supabaseClient = null;

async function initSupabaseClient() {
  const response = await fetch("/api/public-config", {
    headers: { Accept: "application/json" }
  });

  if (!response.ok) {
    throw new Error("Public Supabase config is not available.");
  }

  const config = await response.json();
  if (!config.supabaseUrl || !config.supabaseAnonKey) {
    throw new Error("Supabase config is incomplete.");
  }

  supabaseClient = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
}

function setMsg(text, kind) {
  const box = document.getElementById("alertsMsg");
  box.textContent = text || "";
  box.className = "small page-msg";
  if (kind === "err") box.style.color = "var(--danger)";
  else if (kind === "ok") box.style.color = "var(--accent)";
  else box.style.color = "";
}

function formatDateTime(value) {
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "-";
  return date.toLocaleString("en-GB", {
    year: "numeric",
    month: "short",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit"
  });
}

function getTimingState(booking) {
  const now = Date.now();
  const start = new Date(booking.start_time).getTime();
  const end = new Date(booking.end_time).getTime();

  if (Number.isNaN(start) || Number.isNaN(end)) {
    return { label: "Unknown", className: "done", detail: "Time unavailable" };
  }

  if (now < start) {
    const minutes = Math.ceil((start - now) / 60000);
    return {
      label: "Upcoming",
      className: "upcoming",
      detail: minutes <= 1 ? "Starts very soon" : `Starts in ${minutes} minutes`
    };
  }

  if (now <= end) {
    return {
      label: "Active",
      className: "active",
      detail: "Booking is active now"
    };
  }

  return {
    label: "Completed",
    className: "done",
    detail: "Booking time has passed"
  };
}

async function loadUserBookings(userId) {
  const { data, error } = await supabaseClient
    .from("bookings")
    .select(`
      id,
      start_time,
      end_time,
      status,
      created_at,
      vehicle_registrations:vehicle_id (
        plate_number,
        registration_city
      ),
      parking_slots:slot_id (
        code,
        slot_number,
        floor_id,
        parking_floors:floor_id (
          name,
          code
        )
      )
    `)
    .eq("user_id", userId)
    .order("start_time", { ascending: true });

  if (error) throw error;
  return Array.isArray(data) ? data : [];
}

function renderBookings(bookings) {
  const summary = document.getElementById("alertsSummary");
  const container = document.getElementById("alertsContainer");

  if (!bookings.length) {
    summary.textContent = "No bookings yet.";
    container.innerHTML = "<div class='small'>When you book a slot, it will show here.</div>";
    return;
  }

  summary.textContent = `${bookings.length} booking${bookings.length === 1 ? "" : "s"} found`;
  container.innerHTML = "";

  bookings.forEach((booking) => {
    const timing = getTimingState(booking);
    const slot = booking.parking_slots || {};
    const floor = slot.parking_floors || {};
    const vehicle = booking.vehicle_registrations || {};
    const slotLabel = slot.code || (slot.slot_number ? `Slot ${slot.slot_number}` : "Unknown slot");
    const floorLabel = floor.name || floor.code || (slot.floor_id ? `Floor ${slot.floor_id}` : "-");
    const cityLabel = vehicle.registration_city ? ` • ${vehicle.registration_city}` : "";

    const card = document.createElement("div");
    card.className = "booking-card";
    card.innerHTML = `
      <div class="booking-head">
        <div>
          <div class="booking-title">${slotLabel}</div>
          <div class="small">${floorLabel}</div>
        </div>
        <div class="booking-badges">
          <div class="status-pill ${timing.className}">${timing.label}</div>
          <div class="status-pill">${booking.status || "booked"}</div>
        </div>
      </div>
      <div class="booking-grid">
        <div class="booking-meta">
          <span class="small">Car</span>
          <div>${vehicle.plate_number || "-"}${cityLabel}</div>
        </div>
        <div class="booking-meta">
          <span class="small">Reminder</span>
          <div>${timing.detail}</div>
        </div>
        <div class="booking-meta">
          <span class="small">Start time</span>
          <div>${formatDateTime(booking.start_time)}</div>
        </div>
        <div class="booking-meta">
          <span class="small">End time</span>
          <div>${formatDateTime(booking.end_time)}</div>
        </div>
      </div>
    `;

    container.appendChild(card);
  });
}

async function renderAlertsPage() {
  const summary = document.getElementById("alertsSummary");
  summary.textContent = "Loading your bookings...";
  setMsg("", "");

  try {
    await initSupabaseClient();
    const { data, error } = await supabaseClient.auth.getSession();
    if (error) throw error;

    const session = data ? data.session : null;
    if (!session || !session.user) {
      summary.textContent = "Please login first.";
      document.getElementById("alertsContainer").innerHTML =
        "<div class='small'>Login on the Account page to see your bookings here.</div>";
      return;
    }

    const bookings = await loadUserBookings(session.user.id);
    renderBookings(bookings);
  } catch (err) {
    summary.textContent = "Could not load bookings.";
    document.getElementById("alertsContainer").innerHTML = "";
    setMsg(err.message || "Failed to load alerts.", "err");
  }
}

document.addEventListener("DOMContentLoaded", function () {
  renderAlertsPage();
});
</script>
</body>
</html>
