<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EZP — Alerts</title>

<link rel="stylesheet" href="commoncss-2ndphase.css">
</head>
<body>

<div class="container">
  <div style="display:flex;justify-content:space-between;align-items:flex-start">
    <div>
      <h1>Alerts</h1>
      <div class="small">Get notified when spots become available</div>
    </div>
    <div>
      <button class="chip" id="addAlert">+</button>
    </div>
  </div>

  <div class="card" style="margin-top:18px">
    <div id="alertsContainer"></div>
  </div>
</div>

<div class="bottom-nav">
  <button class="nav-btn" data-page="home" onclick="location='./home.html'">Home</button>
  <button class="nav-btn active" data-page="alerts.html">Alerts</button>
  <button class="nav-btn" data-page="insights" onclick="location='./insights.html'">Insights</button>
  <button class="nav-btn" data-page="settings" onclick="location='./settings.html'">Settings</button>
</div>

<script>
const API = "/api";

/* =========================
   LOAD ALERTS
========================= */
async function loadAlerts(){
  try{
    const r = await fetch(`${API}/alerts`);
    if(!r.ok) throw new Error("Failed to load alerts");
    return await r.json();
  }catch(err){
    console.error(err);
    return [];
  }
}

/* =========================
   RENDER ALERTS
========================= */
async function renderAlerts(){

  const container = document.getElementById("alertsContainer");
  container.innerHTML = "<div class='small'>Loading...</div>";

  const alerts = await loadAlerts();

  if(!alerts.length){
    container.innerHTML =
      "<div class='small'>No alerts yet — click + to add one.</div>";
    return;
  }

  container.innerHTML = "";

  alerts.forEach(a=>{

    const row = document.createElement("div");
    row.className = "alert-item";

    row.innerHTML = `
      <div style="display:flex;gap:12px;align-items:flex-start">
        <div class="badge">${a.slot_code}</div>
        <div>
          <div style="font-weight:700">Slot ${a.slot_code}</div>
          <div class="small">Notify when free</div>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:12px">
        <div class="toggle ${a.enabled ? 'on' : ''}" data-id="${a.id}">
          <div class="knob"></div>
        </div>
        <div class="icon-btn" data-del="${a.id}">🗑</div>
      </div>
    `;

    container.appendChild(row);
  });

  /* ===== TOGGLE ===== */
  document.querySelectorAll(".toggle").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      try{
        await fetch(`${API}/alerts/${btn.dataset.id}/toggle`,{
          method:"PUT"
        });
        renderAlerts();
      }catch(e){
        console.error("Toggle failed");
      }
    });
  });

  /* ===== DELETE ===== */
  document.querySelectorAll("[data-del]").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      try{
        await fetch(`${API}/alerts/${btn.dataset.del}`,{
          method:"DELETE"
        });
        renderAlerts();
      }catch(e){
        console.error("Delete failed");
      }
    });
  });
}

/* =========================
   ADD ALERT
========================= */
document.getElementById("addAlert")
  .addEventListener("click", async ()=>{

    const slotCode = prompt("Enter SLOT CODE (example: G02)");

    if(!slotCode) return;

    try{
      await fetch(`${API}/alerts`,{
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ slot_code: slotCode })
      });

      renderAlerts();

    }catch(err){
      console.error("Add failed");
    }

  });
async function sendNotification(alert, slotId) {

  const message = `Slot ${slotId} is now FREE`;

  console.log("🔔 Sending notification:", message);

  // Insert log
  await supabase
    .from("notifications_log")
    .insert([{
      alert_id: alert.id,
      slot_id: slotId,
      message,
      success: true
    }]);
}
/* =========================
   INIT
========================= */
document.addEventListener("DOMContentLoaded",()=>{
  renderAlerts();
});
</script>
</body>
</html>
