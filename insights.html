<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EZP — Insights</title>

<link rel="stylesheet" href="commoncss-2ndphase.css">
</head>
<body>

<div class="container">
  <header>
    <h1>Insights</h1>
    <div class="small">Real-time zone parking analytics</div>
  </header>
  <div class="day-switch">
  <button id="btnToday" class="day-btn active">Today</button>
  <button id="btnYesterday" class="day-btn">Yesterday</button>
</div>

<!-- Card -->
<div class="card insights-card">

  <div class="insight-left">
    <div class="donut-wrap">
      <div id="donut" class="donut" style="--p:0deg">
        <div id="donutText" class="donut-inner">0%</div>
      </div>
      <div class="small" style="margin-top:10px">
        Zone Occupancy
      </div>
    </div>
  </div>

  <div class="insight-right">
    <div id="bestTime" class="best-time"></div>
    <div class="small" style="margin-top:12px">
      Occupancy by Hour
    </div>
    <div id="hourPreview" class="bars"></div>
  </div>

</div>
  </div>
</div>

<!-- bottom nav -->
<div class="bottom-nav">
  <button class="nav-btn" data-page="home" onclick="location='./home.html'">Home</button>
  <button class="nav-btn" data-page="alerts" onclick="location='./alerts.html'">Alerts</button>
  <button class="nav-btn active" data-page="insighse.html">Insights</button>
  <button class="nav-btn" data-page="settings" onclick="location='./settings.html'">Settings</button>
</div>

<script>
const API = "/api";
let currentDay = "today";

/* =========================
   RENDER INSIGHTS
========================= */
async function renderInsights() {
  try {

    /* ===== Hourly Pattern ===== */
    const r = await fetch(`${API}/insights/hourly?day=${currentDay}`);
    const data = await r.json();
    if (!Array.isArray(data)) return;

    /* ===== Best Time ===== */
    const nonZero = data.filter(d => d.count > 0);
    if (nonZero.length > 0) {
      const best = nonZero.reduce((a,b)=>
        a.count < b.count ? a : b
      );

      document.getElementById("bestTime").innerHTML =
        `Best Time to Park:
         <span style="color:var(--accent)">
           ${String(best.hour).padStart(2,'0')}:00 —
           ${String(best.hour+1).padStart(2,'0')}:00
         </span>`;
    } else {
      document.getElementById("bestTime").textContent =
        "No traffic data for this day";
    }

    /* ===== Donut (Realtime) ===== */
    const zoneRes = await fetch(`${API}/zone/status`);
    const zone = await zoneRes.json();

    document.getElementById("donut")
      .style.setProperty("--p",
        Math.round(360 * zone.percent / 100) + "deg");

    document.getElementById("donutText")
      .textContent = zone.percent + "%";

    /* ===== Bars ===== */
    const container = document.getElementById("hourPreview");
    container.innerHTML = "";

    data.slice(6,22).forEach(d => {

      const row = document.createElement("div");
      row.className = "bar-row";

      row.innerHTML = `
        <div class="bar-label">
          ${String(d.hour).padStart(2,'0')}:00
        </div>
        <div class="bar-track">
          <div class="bar-fill"
               style="width:${d.percent}%"></div>
        </div>
        <div style="width:40px;text-align:right;font-size:12px">
          ${d.percent}%
        </div>
      `;

      container.appendChild(row);
    });

  } catch(err) {
    console.error("Insights error:", err);
  }
}

/* =========================
   DAY SWITCH
========================= */
document.getElementById("btnToday").onclick = () => {
  currentDay = "today";
  setActive("btnToday");
  renderInsights();
};

document.getElementById("btnYesterday").onclick = () => {
  currentDay = "yesterday";
  setActive("btnYesterday");
  renderInsights();
};

function setActive(id) {
  document.querySelectorAll(".day-btn")
    .forEach(b => b.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* =========================
   INIT
========================= */
document.addEventListener("DOMContentLoaded", () => {
  renderInsights();
  setInterval(renderInsights, 5000);
});
</script>

</body>
</html>
